version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unconvert
    - gocritic
    - revive
    - gosec
    - wastedassign
    - contextcheck
    - noctx
    - spancheck
    - sqlclosecheck
  settings:
    custom:
      nilaway:
        type: module
        description: Static analysis tool to detect potential nil panics in Go code.
        settings:
          include-pkgs: "github.com/franchb/example-golangci-lint-ctrlflow-issue"
